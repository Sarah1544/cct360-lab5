<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New York Soundscape - Lab 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>New York Soundscape</h1>

  <div class="media-container">
    <audio id="soundscape" controls>
      <source src="audio/soundscape.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="visual-container">
    <img id="visual-1" class="visual" src="images/bridge.jpg" alt="Manhattan Bridge">
    <img id="visual-2" class="visual" src="images/diner.jpg" alt="Times Square Diner">
    <img id="visual-3" class="visual" src="images/night.jpg" alt="Times Square Night">
  </div>

  <div id="status">Ready to play</div>

  <script src="script.js"></script>
</body>
</html>
