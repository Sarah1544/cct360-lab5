<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 5 - Interactive Media</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Interactive Soundscape</h1>

  <div class="media-container">
    <audio id="soundscape" controls>
      <source src="audio/soundscape.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="visual-container">
    <div id="visual-1" class="visual"></div>
    <div id="visual-2" class="visual"></div>
    <div id="visual-3" class="visual"></div>
  </div>

  <div id="status">Ready to play</div>

  <script src="script.js"></script>
</body>
</html>
